name: Validate library

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install jsonschema pytest
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Build is reproducible and committed generated files are current
        run: python scripts/build.py --check
      - name: Validate registries, schemas and content
        run: python scripts/validate.py
      - name: Skill versions match the recorded content hashes
        run: python scripts/check_skill_versions.py
      - name: Quality score history has no regression
        run: python scripts/check_quality_regression.py
      - name: Evidence, handoff and decision templates are valid
        run: python scripts/trace_evidence.py --templates
      - name: Duplication audit (exact copies and pairs at or above 0.85 fail)
        run: python scripts/audit_duplication.py --threshold 0.85 --fail-on-findings
      - name: Cross-references and orphans (blocking)
        run: python scripts/check_references.py --fail-on-orphans
      - name: Relative Markdown links resolve
        run: python scripts/check_links.py
      - name: Tests (unit, golden, scenario, broken-fixture)
        run: python -m pytest -q
      - name: Legacy fixture tests
        run: python scripts/run_tests.py
      - name: Validate dashboard snapshot JSON and JavaScript
        run: |
          python scripts/build.py
          python -m json.tool dashboard/data/library.json > /dev/null
          node --check dashboard/assets/app.js
      - name: Publish coverage report to the job summary
        run: cat dist/COVERAGE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
