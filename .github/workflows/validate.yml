name: Validate library

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install jsonschema
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Build is reproducible and committed generated files are current
        run: python scripts/build.py --check
      - name: Validate registries, schemas and content
        run: python scripts/validate.py
      - name: Audit duplication (report-only until Phase 6)
        run: python scripts/audit_duplication.py
      - name: Check cross-references (report-only until Phase 6)
        run: python scripts/check_references.py --report-only
      - name: Tests
        run: python scripts/run_tests.py
      - name: Validate dashboard snapshot JSON and JavaScript
        run: |
          python scripts/build.py
          python -m json.tool dashboard/data/library.json > /dev/null
          node --check dashboard/assets/app.js
      - name: Publish coverage report to the job summary
        run: cat dist/COVERAGE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
