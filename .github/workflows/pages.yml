name: Deploy Atelier dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "registry/**"
      - "agents/**"
      - "skills/**"
      - "workflows/**"
      - "adapters/**"
      - "scripts/generate_dashboard_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate dashboard data from canonical registries
        run: python scripts/generate_dashboard_data.py

      - name: Validate generated dashboard data
        run: python -m json.tool dashboard/data/library.json > /dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
